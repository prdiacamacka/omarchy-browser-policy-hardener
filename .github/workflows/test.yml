name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck omarchy-browser-policy-hardener files/omarchy-theme-browser-policy files/omarchy-theme-set-browser files/omarchy-install-browser tests/test.sh
      - name: Functional tests
        run: sudo tests/test.sh
